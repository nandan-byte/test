name: Build Cross-Platform Executables

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build for Linux (ubuntu-latest)
    runs-on: ubuntu-latest
        
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install nuitka python-minifier
        
    - name: Install Patchelf (Linux)
      run: sudo apt-get update && sudo apt-get install -y patchelf

    - name: Setup Trivy
      uses: aquasecurity/setup-trivy@v0.2.6
      with:
        cache: true

    - name: Prepare Trivy for Bundling
      shell: bash
      run: |
        mkdir -p appsecai/.bin/trivy
        TRIVY_PATH=$(which trivy || command -v trivy)
        echo "Trivy located at: $TRIVY_PATH"
        cp "$TRIVY_PATH" appsecai/.bin/trivy/

    - name: Build and Package (Linux)
      run: |
        bash scripts/build_linux.sh

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: AppSecAI-linux
        path: AppSecAI_Installer_Linux.AppImage
        if-no-files-found: error
        retention-days: 7
