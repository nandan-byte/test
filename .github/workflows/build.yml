name: Build Cross-Platform Executables

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: windows-latest
            artifact_name: AppSecAI-windows
            artifact_path: AppSecAI_Installer.exe
          - os: ubuntu-latest
            artifact_name: AppSecAI-linux
            artifact_path: AppSecAI_Installer_Linux.AppImage
          - os: macos-latest
            artifact_name: AppSecAI-macos
            artifact_path: dist/AppSecAI-macos.zip
        
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install nuitka python-minifier
        
    - name: Install Patchelf (Linux)
      if: matrix.os == 'ubuntu-latest'
      run: sudo apt-get update && sudo apt-get install -y patchelf

    - name: Setup Trivy
      uses: aquasecurity/setup-trivy@v0.2.6
      with:
        cache: true

    - name: Prepare Trivy for Bundling
      shell: bash
      run: |
        # Config expects it in appsecai/.bin/trivy/
        mkdir -p appsecai/.bin/trivy
        TRIVY_PATH=$(which trivy || command -v trivy)
        echo "Trivy located at: $TRIVY_PATH"
        cp "$TRIVY_PATH" appsecai/.bin/trivy/
        if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
           # Ensure the .exe extension is present for Windows bundling
           [[ "$TRIVY_PATH" == *.exe ]] || mv appsecai/.bin/trivy/trivy appsecai/.bin/trivy/trivy.exe 2>/dev/null || true
        fi

    - name: Build and Package (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        powershell scripts/build_windows.ps1

    - name: Build and Package (Linux)
      if: matrix.os == 'ubuntu-latest'
      run: |
        bash scripts/build_linux.sh

    - name: Build and Package (macOS)
      if: matrix.os == 'macos-latest'
      run: |
        bash scripts/build_mac.sh
        # Zip the .app bundle to preserve symlinks and attributes
        cd dist && zip -r AppSecAI-macos.zip AppSecAI.app && cd ..

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact_name }}
        path: ${{ matrix.artifact_path }}
        if-no-files-found: error
        retention-days: 7
